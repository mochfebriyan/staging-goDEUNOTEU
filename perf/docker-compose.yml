# k6 load generator in Docker. Supabase itself runs in Docker too, started
# by `npx supabase start` (see perf/README.md).
#
#   docker compose -f perf/docker-compose.yml run --rm --service-ports k6 run /scripts/load-test.js
services:
  k6:
    image: grafana/k6:1.0.0
    env_file: .env
    # The image's default user can't write to perf/results on Linux hosts.
    user: "0:0"
    environment:
      # Live dashboard at http://localhost:5665 during the run; an HTML
      # report with graphs is saved to perf/results/<RUN_NAME>-report.html.
      K6_WEB_DASHBOARD: "true"
    # Name each run with `-e RUN_NAME=...` so result files don't overwrite.
    entrypoint:
      - sh
      - -c
      - 'export RUN_NAME="$${RUN_NAME:-run}"; export K6_WEB_DASHBOARD_EXPORT="/results/$${RUN_NAME}-report.html"; exec k6 "$$@"'
      - k6
    ports:
      - "5665:5665"
    volumes:
      - ./k6:/scripts:ro
      - ./results:/results
    # Lets the container reach Supabase on your machine (localhost:54321)
    # on Windows, macOS and Linux alike.
    extra_hosts:
      - "host.docker.internal:host-gateway"
